name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for script in bin/*; do bash -n "$script"; done
      - name: Config generator tests
        run: python3 -m unittest discover -s opencode
      - name: App tests
        run: swift test --package-path app
